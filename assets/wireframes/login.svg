<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-label="login">
<title>login — SwapLoop Admin wireframe</title>
<rect x="0" y="0" width="960" height="640" rx="0" fill="#f4f4f1" stroke="none" stroke-width="1.5"/>
<rect x="300" y="140" width="360" height="340" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="480" y="190" font-size="20" font-weight="700" fill="#2c5f4a" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">SwapLoop Admin</text>
<text x="480" y="218" font-size="13" font-weight="normal" fill="#666666" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">Staff sign in</text>
<text x="330" y="260" font-size="11" font-weight="normal" fill="#666666" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Email</text>
<rect x="330" y="268" width="300" height="34" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="340" y="289.0" font-size="12" font-weight="normal" fill="#999999" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">admin@swaploop.test</text>
<text x="330" y="330" font-size="11" font-weight="normal" fill="#666666" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">Password</text>
<rect x="330" y="338" width="300" height="34" rx="2" fill="#ffffff" stroke="#333333" stroke-width="1.5"/>
<text x="340" y="359.0" font-size="12" font-weight="normal" fill="#999999" text-anchor="start" font-family="ui-sans-serif, system-ui, sans-serif">••••••••</text>
<rect x="330" y="400" width="300" height="36" rx="2" fill="#2c5f4a" stroke="#2c5f4a" stroke-width="1.5"/>
<text x="480.0" y="422.0" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif">Sign in</text>
</svg>
